==================================================
26. SECURITY
==================================================

Implement secure authentication and authorization.

Use role-based access control.

Never allow:
Teacher -> Super Admin functions
Parent -> Admin functions
Student -> Admin functions

Use secure password authentication.

Passwords must never be stored as plain text.

Use secure database rules.

Prevent unauthorized access to student marks, fees and personal information.

Add:
- Password reset
- Logout
- Session management
- Account activation/deactivation
- User permission management
- Audit logs

