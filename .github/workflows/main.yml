Create a complete, professional, production-ready Android School Management System for:

SCHOOL NAME:
AL-NOOR MODEL ACADEMY

RUN BY:
Baromasia Al Nur Academy Foundation

IMPORTANT:
Build this as a complete School Management Web-App-like Android application, not as a simple static Android app.

The application must have a modern responsive dashboard, cloud database, secure authentication, role-based permissions, PDF generation, printing/sharing support, online payment support, notifications, search, reports and complete school administration features.

==================================================
1. USER ROLES & LOGIN
==================================================

Create completely separate secure login systems for:

1. SUPER ADMIN / SCHOOL AUTHORITY
2. TEACHER
3. PARENT
4. STUDENT

Each user must have a unique Login ID/Email/Mobile Number and Password.

SUPER ADMIN:
- Full access to the entire application
- Can create, edit, delete and customize almost every module
- Can create Teacher, Parent and Student accounts
- Can assign permissions
- Can change school settings
- Can customize dashboard, menu and modules
- Can manage all school data

TEACHER:
Teachers must NOT have Super Admin permissions.

Teacher can:
- Teacher profile
- Self attendance
- Student attendance
- View assigned classes
- View assigned subjects
- Add/edit marks for assigned subjects/classes
- Submit marks
- Generate/view results according to permission
- Create question papers according to selected syllabus
- View class routine
- View notices
- Upload study materials/homework
- View student basic information

PARENT:
Parent can ONLY:
- Login
- View linked child/children
- View results/marksheet
- View examination results
- View fees
- View paid amount
- View outstanding/dues amount
- View payment history
- Download/print receipts if permitted
- Receive school notices

Parent must NOT be able to edit marks, attendance, student information or school settings.

STUDENT:
Student can ONLY:
- Login
- View own profile
- View attendance
- View results/marksheet
- View examination results
- View fees
- View paid/dues/clear amount
- View class routine
- View homework/study materials
- View school notices

Student cannot modify official data.

